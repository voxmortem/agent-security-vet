name: ci

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unittest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to full commit SHAs. The SHAs were read from the GitHub API
      # (repos/actions/<repo>/commits/<tag>) on 2026-11-26; the tag is noted next to each.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test-suite (standard library only, isolated mode, no bytecode)
        env:
          # Shared runners are slower than a developer machine; see tests/test_robustness.py.
          VETSCAN_TEST_TIME_FACTOR: "3"
        run: python -I -B -m unittest discover -s tests -v
